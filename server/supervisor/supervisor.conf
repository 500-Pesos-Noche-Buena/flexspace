[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

; 1. Local Redis Process (Priority 1 = Starts First)
[program:redis]
command=redis-server --daemonize no --bind 127.0.0.1
autostart=true
autorestart=true
priority=1
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; 2. Node.js Main Server (Priority 10 = Starts After Redis)
[program:app]
command=node /app/server.js
directory=/app
autostart=true
autorestart=true
priority=10
startsecs=3
startretries=5
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="5000"

; 3. AI Blog Generator Cron Job
[program:cron]
command=node /app/cron/generate-blogs.js
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=3
startretries=3
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="5000"